project:
  type: book
  output-dir: _book

  # Pin working directory to the project root. Quarto's default is "file",
  # which is identical today (every chapter is at the root) but breaks
  # silently the first time a .qmd gets nested in a subdirectory.
  execute-dir: project

  preview:
    port: 4200
    browser: true

  # NOTE: no `render:` key here on purpose.
  # For a book project, Quarto derives the render list from book.chapters +
  # book.appendices. Supplying an explicit `render` list overrides that, and
  # "*.qmd" would sweep in every loose file at the repo root -- including the
  # commented-out chapters below, the moment those files exist. The chapter
  # list IS the guard: reports/ and app/ are excluded because they simply
  # aren't listed.

book:
  title: "Raining Tables"
  subtitle: "A field guide for scripts in search of a pipeline"
  author: "Anna Steph"
  date: today
  date-format: "MMMM YYYY"

  # Uncomment once these files exist in the repo root.
  # cover-image: cover.png
  # favicon: favicon.png

  site-url: https://anna-steph.github.io/rainingtables/
  repo-url: https://github.com/anna-steph/rainingtables
  repo-branch: main

  search: true

  sidebar:
    style: docked
    collapse-level: 1
    border: false

  page-footer:
    border: false
    left: "Raining Tables, built with Quarto, NOAA precipitation data, & ❤️. Views, Dad jokes, & errors my own. Web design & css all Claude."
    right:
      - icon: github
        href: https://github.com/anna-steph/rainingtables

  chapters:
    - index.qmd

    - part: "Flow"
      chapters:
        - 01_static-output-drip.qmd   # (a) read in a csv, export charts and tables
        - 02_apis-water-main.qmd      # (b) live data from the NOAA API
        - 03_params-pipe-specs.qmd    # (c) params for report templates
        - 04_database-plumbing.qmd    # (d) writing to dbs
        - 05_cloud-storage.qmd        # (e) write outputs to Google Drive

    - part: "Taps"
      chapters:
        - 06_api-waterheater.qmd      # (f) writing to an API
        - 07_rain-apps.qmd            # (g) minimal web apps

    - part: "Weatherproofing"
      chapters:
        - 08_maintenance.qmd          # (h) renv / uv and unit tests
        - 09_containers.qmd           # (i) Docker
        - 10_github-actions.qmd       # (j) scheduled data pulls
        - 11_on-cloud.qmd            # (k) clouds

    - part: "Blueprints"
      chapters:
        - 12_end-to-end.qmd
        - 13_where-next.qmd

  appendices:
    - a_setup.qmd
    - b_noaa-data.qmd
    #- c_troubleshooting.qmd
    #- d_glossary.qmd

format:
  html:
    theme:
      - lumen
      # Add a custom.scss here later if you want to tune type/spacing;
      # the list form is already set up for it.

    toc: true
    toc-depth: 3
    toc-title: "On this page"

    # Numbering is ON so that @sec- cross-references resolve to a chapter
    # number. In a step-by-step guide you will constantly write "as we set up
    # in Chapter 2" -- without numbering those links have to be hand-written
    # and they rot when you reorder. depth 1 numbers chapters only, not every
    # H2/H3, so pages stay visually calm.
    number-sections: true
    number-depth: 1

    fig-align: center
    fig-responsive: true
    tbl-cap-location: bottom

    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github

    link-external-newwindow: true
    link-external-icon: false
    smooth-scroll: true
    anchor-sections: true

    # code-link turns function names in code blocks into links to their docs.
    # Requires the downlit and xml2 R packages at render time. Drop it if you
    # want the CI render to work without any R installation at all.
    code-link: true

# No PDF format on purpose. Adding one pulls TinyTeX into every CI run and is
# the single most common reason a Quarto GitHub Action fails on the first try.
# Add it later, deliberately, if someone actually asks for a PDF.

execute:
  # Commit the _freeze/ directory. This is the whole mechanism: you render
  # locally where you have credentials, results get cached, and CI rebuilds
  # the site from cache without ever calling NOAA, Google Drive, Docker, or AWS.
  freeze: auto

  echo: true
  warning: false

  # Messages left visible on purpose. In this book the message often IS the
  # lesson -- renv::restore() output, a DB connection notice, a dplyr join
  # reporting which keys matched. Silence them per-chunk (#| message: false)
  # where they're just noise.
  message: true

  # Errors halt the render by default, which is what you want. Use
  # #| error: true on individual chunks for the deliberate "here's what
  # happens when the API key isn't set" demonstrations.
  error: false

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    fig.width: 7
    fig.height: 4.2
    dpi: 200
    out.width: "100%"

editor: source