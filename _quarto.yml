project:
  type: book
  output-dir: _book
  preview:
    port: 4200
    browser: true

book:
  title: "Raining Tables"
  subtitle: "A field guide for scripts in search of a pipeline"
  author: "Anna Steph"
  date: today
  date-format: "MMMM YYYY"

  # Uncomment once these files exist in the repo root.
  # cover-image: cover.png
  # favicon: favicon.png

  site-url: https://anna-steph.github.io/rainingtables/
  repo-url: https://github.com/anna-steph/rainingtables
  repo-branch: main
  search: true

  sidebar:
    style: docked
    collapse-level: 1
    border: false

  page-footer:
    border: false
    left: "Raining Tables, built with Quarto, NOAA precipitation data, & ❤️. Views, Dad jokes, & errors my own. Web design & css all Claude."
    right:
      - icon: github
        href: https://github.com/anna-steph/rainingtables

  chapters:
    - index.qmd

    - part: "Flow"
      chapters:
        - 01-static_output_drip.qmd   # (a) read in a csv, export charts and tables
        - 02-apis_water_main.qmd      # (b) live data from the NOAA API
        - 03-params_pipe_specs.qmd    # (d) params for report templates
        - 04-database_plumbing.qmd    # (c) reading out to dbs
        - 05-cloud_storage.qmd        # (e) write outputs to Google Drive

    - part: "Taps"
      chapters:
        
        - 06-api_waterheater.qmd      # (f) read out to an API
        - 07-rain_apps.qmd            # (g) minimal web apps

    - part: "Weatherproofing"
      chapters:
        - 08-maintenance.qmd          # (h) renv / uv and unit tests
        - 09-containers.qmd           # (i) Docker
        - 10-github_actions.qmd       # (j) scheduled data pulls
        #- 11-on_cloud.qmd             # (k) clouds

    - part: "Blueprints"
      chapters:
        - 12-end_to_end.qmd
        - 13-where_next.qmd

  appendices:
    - a-setup.qmd
    - b-noaa_data.qmd
    #- c-troubleshooting.qmd
    #- d-glossary.qmd

format:
  html:
    theme:
      - lumen
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    number-depth: 2
    fig-align: center
    fig-responsive: true
    tbl-cap-location: bottom
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    highlight-style: github
    link-external-newwindow: true
    link-external-icon: false
    smooth-scroll: true
    anchor-sections: true
    # code-link turns function names in code blocks into links to their docs.
    # Requires the downlit and xml2 R packages at render time. Drop it if you
    # want the CI render to work without any R installation at all.
    code-link: true

# No PDF format on purpose. Adding one pulls TinyTeX into every CI run and is
# the single most common reason a Quarto GitHub Action fails on the first try.
# Add it later, deliberately, if someone actually asks for a PDF.

execute:
  freeze: auto      # commit the _freeze/ directory — this is what keeps CI from
                    # trying to call NOAA, Google Drive, Docker, or AWS
  echo: true
  warning: false
  message: false
  error: false

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    fig.width: 7
    fig.height: 4.2
    dpi: 200
    out.width: "100%"

editor: source